name: Build pip wheels

on:
  workflow_call:
  workflow_dispatch:

jobs:
  changes:
    name: Detect CPU-relevant changes
    runs-on: ubuntu-latest
    outputs:
      has_cpu_changes: ${{ steps.filter.outputs.cpu }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          # CPU wheels are pointless on a GPU-only PR. This single negated glob
          # matches any changed file that is NOT exclusive to a GPU backend, so
          # shared build files (cmake, CMakeLists, pyproject, this workflow)
          # still count as CPU changes and keep the wheel matrix running.
          filters: |
            cpu:
              - '!{faiss/gpu,faiss/gpu_metal,c_api/gpu,conda/faiss-gpu,conda/faiss-gpu-cuvs}/**'

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: changes
    if: ${{ needs.changes.outputs.has_cpu_changes == 'true' || github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, macos-15-intel, windows-2022, windows-11-arm, 2-core-ubuntu-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build wheels
        uses: pypa/cibuildwheel@ee02a1537ce3071a004a6b08c41e72f0fdc42d9a  # v3.4.0
        env:
          CIBW_BUILD_VERBOSITY: 1

      # Verify the freshly-built wheels install through `uv`, the resolution
      # path users hit in issue #4510 ("faiss can only be installed by conda").
      # cibuildwheel already runs the smoke tests via pip inside its test
      # containers; this step additionally guarantees the wheels are resolvable
      # and importable when installed with `uv pip install` from the wheelhouse.
      # The smoke tests are dependency-light, so we do not need scipy here.
      - name: Verify uv install
        shell: bash
        run: |
          python -m pip install --quiet uv
          uv venv --python 3.12 .uv-smoke
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            UV_PY=.uv-smoke/Scripts/python.exe
          else
            UV_PY=.uv-smoke/bin/python
          fi
          uv pip install --python "$UV_PY" numpy pytest wheelhouse/
          "$UV_PY" -m pytest tests/test_wheel_smoke.py -v

      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: [build-wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/faiss-cpu
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e  # v4.1.7
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc  # release/v1
        with:
          verbose: true
          attestations: false

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build-wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/faiss-cpu
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e  # v4.1.7
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true
